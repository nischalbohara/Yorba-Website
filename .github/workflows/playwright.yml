name: Playwright Tests 
 
on: 
  push: 
    branches: [main] 
  pull_request: 
    branches: [main] 
  workflow_dispatch: 
 
jobs: 
  test: 
    timeout-minutes: 60 
    runs-on: ubuntu-latest 
 
    outputs: 
      total: ${{ steps.test-results.outputs.total }} 
      passed: ${{ steps.test-results.outputs.passed }} 
      failed: ${{ steps.test-results.outputs.failed }} 
      skipped: ${{ steps.test-results.outputs.skipped }} 
 
    steps: 
      - name: Checkout Repository 
        uses: actions/checkout@v4 
 
      - name: Set up Node.js 
        uses: actions/setup-node@v4 
 
      - name: Install Dependencies 
        run: npm ci 
 
      - name: Install Playwright Browsers 
        run: npx playwright install --with-deps chromium 
 
      - name: Run Playwright Tests 
        run: npx playwright test 

      - name: Get Test Results
        if: always()
        id: test-results
        run: |
          node - <<'EOF'
          const fs = require('fs');

          const data = JSON.parse(
            fs.readFileSync('test-results.json', 'utf8')
          );

          let passed = 0;
          let failed = 0;
          let skipped = 0;
          let total = 0;

          function countSuite(suite) {
            for (const spec of suite.specs || []) {
              for (const test of spec.tests || []) {
                total++;

                const status = test.status;

                if (status === 'expected') passed++;
                else if (status === 'unexpected') failed++;
                else if (status === 'skipped') skipped++;
              }
            }

            for (const child of suite.suites || []) {
              countSuite(child);
            }
          }

          for (const suite of data.suites || []) {
            countSuite(suite);
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `total=${total}\n` +
            `passed=${passed}\n` +
            `failed=${failed}\n` +
            `skipped=${skipped}\n`
          );
          EOF
 
      - name: Upload Snapshots 
        uses: actions/upload-artifact@v4 
        if: always() 
        with: 
          name: updated-snapshots 
          path: tests/**/*-snapshots/** 
          retention-days: 7 
 
      - name: Upload Test Results 
        uses: actions/upload-artifact@v4 
        if: ${{ !cancelled() }} 
        with: 
          name: playwright-report 
          path: playwright-report/ 
          retention-days: 30 
 
  notify-slack:
    name: Send Slack Notification
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Notify Slack with Test Results
        if: always()
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*GitHub Actions Test Run Complete* :rocket:\n*Repository:* ${{ github.repository }}\n*Status:* ${{ needs.test.result }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*📊 Playwright Test Summary*\n*Total:* ${{ needs.test.outputs.total }}\n*Passed:* :white_check_mark: ${{ needs.test.outputs.passed }}\n*Failed:* :x: ${{ needs.test.outputs.failed }}\n*Skipped:* :fast_forward: ${{ needs.test.outputs.skipped }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Workflow Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL2 }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK