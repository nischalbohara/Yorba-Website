name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ... your setup steps (Node, npm install, run tests, etc.) go here ...

      - name: Extract Playwright Results & Failures
        if: always()
        id: playwright-stats
        run: |
          node -e '
            const fs = require("fs");
            if (!fs.existsSync("results.json")) process.exit(0);
            const data = JSON.parse(fs.readFileSync("results.json", "utf8"));
            let passed = 0, failed = 0, flaky = 0;
            let failedNames = [];

            function jsonEscape(str) {
              return str
                .replace(/\\/g, "\\\\")
                .replace(/"/g, "\\\"")
                .replace(/\r?\n/g, " ");
            }

            function countSpecs(suite) {
              if (suite.specs) {
                suite.specs.forEach(spec => {
                  const statuses = spec.tests.flatMap(t => t.results.map(r => r.status));
                  if (statuses.includes("unexpected")) {
                    if (statuses.includes("expected")) {
                      flaky++;
                    } else {
                      failed++;
                      if (failedNames.length < 5) failedNames.push(spec.title);
                    }
                  } else if (statuses.includes("expected")) {
                    passed++;
                  }
                });
              }
              if (suite.suites) suite.suites.forEach(countSpecs);
            }

            if (data.suites) data.suites.forEach(countSpecs);

            const failedList = failedNames.length > 0
              ? failedNames.map(n => jsonEscape(`• ${n}`)).join("\\n")
              : "None";

            let headerText;
            if (failed > 0) {
              headerText = "🎭 Playwright Test Failures Detected";
            } else if (flaky > 0) {
              headerText = "⚠️ Playwright Tests Flaky";
            } else {
              headerText = "✅ Playwright Tests Passed";
            }

            const output = `passed=${passed}\nfailed=${failed}\nflaky=${flaky}\nfailed_specs=${failedList}\nheader_text=${headerText}\n`;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, output);
          '

      - name: Notify Slack (Test Results)
        if: always() && steps.playwright-stats.outputs.passed != ''
        uses: slackapi/slack-github-action@v2.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL2 }}
          webhook-type: INCOMING_WEBHOOK
          payload: |
            {
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "${{ steps.playwright-stats.outputs.header_text }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repository:*\n${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author:*\n${{ github.actor }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*PR / Commit:*\n${{ github.event.pull_request.html_url || github.sha }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Results:*\n✅ Passed: ${{ steps.playwright-stats.outputs.passed }} | ⚠️ Flaky: ${{ steps.playwright-stats.outputs.flaky }} | ❌ Failed: ${{ steps.playwright-stats.outputs.failed }}"
                    }
                  ]
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Failed Tests (Top 5):*\n${{ steps.playwright-stats.outputs.failed_specs }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Action Run & Download Report"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }